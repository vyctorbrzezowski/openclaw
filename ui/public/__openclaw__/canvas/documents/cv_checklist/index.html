<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; padding: 22px; background: transparent; color: CanvasText; }
      main { padding: 22px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 16px; background: color-mix(in srgb, Canvas 93%, CanvasText 7%); }
      h2 { margin: 0 0 16px; font-size: 16px; }
      label { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, CanvasText 10%, transparent); cursor: pointer; font-size: 14px; line-height: 1.4; }
      input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: #d13c3c; }
      label:has(input:checked) span { color: color-mix(in srgb, CanvasText 48%, transparent); text-decoration: line-through; }
      output { display: block; margin-top: 14px; color: color-mix(in srgb, CanvasText 62%, transparent); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h2>Release checklist</h2>
      <label><input type="checkbox" checked /><span>Focused regression proof</span></label>
      <label><input type="checkbox" /><span>Review exact production diff</span></label>
      <label><input type="checkbox" /><span>Verify operator-visible behavior</span></label>
      <output id="progress">1 of 3 complete</output>
    </main>
    <script>
      const boxes = [...document.querySelectorAll("input")]; const progress = document.querySelector("#progress");
      const update = () => { progress.value = `${boxes.filter((box) => box.checked).length} of ${boxes.length} complete`; };
      boxes.forEach((box) => box.addEventListener("change", update)); update();
      const report = () => parent.postMessage({ type: "openclaw:widget-size", height: document.documentElement.scrollHeight }, "*");
      new ResizeObserver(report).observe(document.body); report();
    </script>
  </body>
</html>
