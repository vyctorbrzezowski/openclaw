<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; padding: 22px; background: transparent; color: CanvasText; }
      main { padding: 22px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 16px; background: color-mix(in srgb, Canvas 93%, CanvasText 7%); }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      h2 { margin: 0; font-size: 16px; }
      header span { color: #16a34a; font-size: 12px; font-weight: 650; }
      dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 0; }
      div { padding: 14px; border-radius: 12px; background: color-mix(in srgb, CanvasText 6%, transparent); }
      dt { color: color-mix(in srgb, CanvasText 60%, transparent); font-size: 11px; text-transform: uppercase; }
      dd { margin: 7px 0 0; font-size: 24px; font-variant-numeric: tabular-nums; font-weight: 700; }
      svg { display: block; width: 100%; height: 90px; margin-top: 18px; overflow: visible; }
      polyline { fill: none; stroke: #d13c3c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      @media (max-width: 520px) { dl { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header><h2>Run health</h2><span>Within budget</span></header>
      <dl><div><dt>Latency</dt><dd>1.8s</dd></div><div><dt>Tokens</dt><dd>14.2k</dd></div><div><dt>Cost</dt><dd>$0.42</dd></div></dl>
      <svg viewBox="0 0 600 90" preserveAspectRatio="none" aria-label="Latency trend"><polyline points="0,68 75,52 150,60 225,28 300,42 375,18 450,36 525,22 600,12" /></svg>
    </main>
    <script>
      const report = () => parent.postMessage({ type: "openclaw:widget-size", height: document.documentElement.scrollHeight }, "*");
      new ResizeObserver(report).observe(document.body); report();
    </script>
  </body>
</html>
