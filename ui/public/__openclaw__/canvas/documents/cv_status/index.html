<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; padding: 18px; background: transparent; color: CanvasText; }
      main { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 14px; background: color-mix(in srgb, Canvas 94%, CanvasText 6%); }
      i { width: 11px; height: 11px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 5px color-mix(in srgb, #16a34a 16%, transparent); }
      div { min-width: 0; }
      strong, span { display: block; }
      strong { font-size: 14px; }
      span { margin-top: 3px; color: color-mix(in srgb, CanvasText 62%, transparent); font-size: 12px; }
    </style>
  </head>
  <body>
    <main><i></i><div><strong>Gateway healthy</strong><span>12 channels connected · checked just now</span></div></main>
    <script>
      const report = () => parent.postMessage({ type: "openclaw:widget-size", height: document.documentElement.scrollHeight }, "*");
      new ResizeObserver(report).observe(document.body); report();
    </script>
  </body>
</html>
